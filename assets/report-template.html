<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZeroTrustLens — {{TITLE}}</title>
  <style>
    :root {
      --bg:#090d16; --card:#111827; --card2:#0d1320; --border:#1e293b;
      --text:#e2e8f0; --muted:#94a3b8; --accent:#38bdf8;
      --ok:#22c55e; --fail:#ef4444; --warn:#f59e0b; --skip:#a855f7;
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); display:flex; min-height:100vh; }
    .sidebar { width:270px; background:var(--card2); border-right:1px solid var(--border); padding:20px 14px; display:flex; flex-direction:column; gap:4px; position:sticky; top:0; height:100vh; overflow-y:auto; flex-shrink:0; }
    .brand { display:flex; align-items:center; gap:10px; font-size:18px; font-weight:700; padding:0 8px 14px; border-bottom:1px solid var(--border); margin-bottom:8px; }
    .logo { width:32px; height:32px; border-radius:8px; background:linear-gradient(135deg,#0ea5e9,#6366f1); display:flex; align-items:center; justify-content:center; font-weight:800; color:#fff; font-size:14px; }
    .nav-grp { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); padding:10px 10px 4px; font-weight:700; }
    .nav-btn { background:transparent; border:none; color:var(--muted); text-align:left; padding:9px 10px; border-radius:8px; cursor:pointer; font-size:13.5px; font-weight:500; transition:.15s; display:flex; justify-content:space-between; align-items:center; width:100%; }
    .nav-btn:hover { background:rgba(56,189,248,.08); color:var(--text); }
    .nav-btn.active { background:rgba(56,189,248,.16); color:var(--accent); font-weight:600; }
    .cnt { font-size:11px; background:#1e293b; color:var(--muted); padding:2px 7px; border-radius:999px; }
    .nav-btn.active .cnt { background:rgba(56,189,248,.22); color:var(--accent); }
    .main { flex:1; padding:26px 30px; max-width:1360px; margin:0 auto; width:100%; }
    .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:22px; flex-wrap:wrap; gap:12px; border-bottom:1px solid var(--border); padding-bottom:16px; }
    .meta { font-size:13px; color:var(--muted); margin-top:4px; }
    .btn { background:rgba(56,189,248,.14); color:var(--accent); border:1px solid rgba(56,189,248,.35); padding:7px 13px; border-radius:8px; font-size:12.5px; font-weight:600; cursor:pointer; }
    .btn:hover { background:rgba(56,189,248,.24); }
    .tab-panel { display:none; }
    .tab-panel.active { display:block; }
    .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(175px,1fr)); gap:12px; margin-bottom:20px; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:15px; }
    .card .lbl { font-size:12px; color:var(--muted); margin-bottom:5px; }
    .card .val { font-size:26px; font-weight:700; }
    .charts-row { display:grid; grid-template-columns:280px 1fr; gap:16px; margin-bottom:20px; }
    @media (max-width:960px) { body { flex-direction:column; } .sidebar { width:100%; height:auto; position:static; flex-direction:row; flex-wrap:wrap; } .charts-row { grid-template-columns:1fr; } }
    .bar-row { margin-bottom:12px; }
    .bar-head { display:flex; justify-content:space-between; font-size:13px; margin-bottom:5px; }
    .bar-track { height:10px; background:#1e293b; border-radius:999px; overflow:hidden; }
    .bar-fill { height:100%; background:linear-gradient(90deg,#0ea5e9,#22c55e); border-radius:999px; }
    .filter-bar { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px; margin-bottom:14px; display:flex; flex-direction:column; gap:10px; }
    .filter-row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    .chip { background:#0b1120; border:1px solid var(--border); color:var(--muted); padding:5px 10px; border-radius:999px; font-size:12px; cursor:pointer; transition:.15s; }
    .chip:hover { border-color:var(--accent); color:var(--text); }
    .chip.active { background:rgba(56,189,248,.16); border-color:var(--accent); color:var(--accent); font-weight:600; }
    input, select { background:#0b1120; color:var(--text); border:1px solid var(--border); border-radius:8px; padding:7px 11px; font-size:13px; }
    input { min-width:240px; flex:1; }
    .finding { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px 16px; margin-bottom:10px; }
    .finding-top { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; }
    .f-meta { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; font-size:11.5px; color:var(--muted); }
    .tag { background:#1e293b; padding:2px 8px; border-radius:6px; }
    .pill { font-size:11px; padding:3px 9px; border-radius:999px; font-weight:600; display:inline-block; }
    .pill.Passed { background:rgba(34,197,94,.15); color:var(--ok); }
    .pill.Failed { background:rgba(239,68,68,.15); color:var(--fail); }
    .pill.Skipped { background:rgba(168,85,247,.15); color:var(--skip); }
    .pill.Investigate, .pill.Planned { background:rgba(245,158,11,.15); color:var(--warn); }
    details { margin-top:10px; border-top:1px solid var(--border); padding-top:10px; }
    summary { cursor:pointer; color:var(--accent); font-size:13px; font-weight:600; }
    .rem-box { margin-top:8px; background:#090d16; border:1px solid var(--border); border-radius:8px; padding:14px; font-size:13px; line-height:1.6; }
    .md-table { width:100%; border-collapse:collapse; margin:10px 0; font-size:12.5px; }
    .md-table th, .md-table td { border:1px solid var(--border); padding:7px 10px; text-align:left; }
    .md-table th { background:#131c31; color:var(--accent); }
    .md-ul { margin:6px 0 8px 20px; }
    a { color:var(--accent); text-decoration:none; }
    a:hover { text-decoration:underline; }
    .road-card { cursor:pointer; transition:.15s; }
    .road-card:hover, .road-card.active { border-color:var(--accent); background:rgba(56,189,248,.08); }
    @media print {
      body { background:#fff; color:#0f172a; display:block; }
      .sidebar, .btn, .filter-bar, details summary { display:none !important; }
      .main { padding:0; max-width:100%; }
      .card, .finding, .rem-box { background:#fff; border-color:#cbd5e1; color:#0f172a; break-inside:avoid; }
      .tab-panel { display:block !important; margin-bottom:24px; }
      #tab-findings { display:none !important; }
    }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><div class="logo">ZL</div><span>ZeroTrustLens</span></div>
    <button class="nav-btn active" onclick="switchView('overview', null, this)" id="navOverview">Genel Bakış</button>
    <div class="nav-grp" id="grpPillars">Güvenlik Sütunları</div>
    <button class="nav-btn" onclick="switchView('findings', 'Identity', this)" id="navIdentity"><span>Identity (Kimlik)</span><span class="cnt" id="cntIdentity">0</span></button>
    <button class="nav-btn" onclick="switchView('findings', 'Devices', this)" id="navDevices"><span>Devices (Cihazlar)</span><span class="cnt" id="cntDevices">0</span></button>
    <button class="nav-btn" onclick="switchView('findings', 'Network', this)" id="navNetwork"><span>Network (Ağ)</span><span class="cnt" id="cntNetwork">0</span></button>
    <button class="nav-btn" onclick="switchView('findings', 'DataAI', this)" id="navDataAI"><span>Data &amp; AI</span><span class="cnt" id="cntDataAI">0</span></button>
    <button class="nav-btn" onclick="switchView('findings', 'SecOps', this)" id="navSecOps"><span>SecOps</span><span class="cnt" id="cntSecOps">0</span></button>
    <button class="nav-btn" onclick="switchView('findings', 'CISA SCuBA', this)" id="navScuba"><span>CISA SCuBA</span><span class="cnt" id="cntScuba">0</span></button>
    <button class="nav-btn" onclick="switchView('findings', 'ORCA', this)" id="navOrca"><span>MDO / E-posta (ORCA)</span><span class="cnt" id="cntOrca">0</span></button>
    <button class="nav-btn" onclick="switchView('findings', 'ALL', this)" id="navAllFindings"><span>Tüm Bulgular</span><span class="cnt" id="cntAll">0</span></button>
    <div class="nav-grp" id="grpExec">Yönetici &amp; CISO</div>
    <button class="nav-btn" onclick="switchView('findings', 'QUICKWINS', this)" id="navQuickWins"><span>Hızlı Kazanımlar</span><span class="cnt" id="cntQuick">0</span></button>
    <button class="nav-btn" onclick="switchView('frameworks', null, this)" id="navFrameworks">Uyumluluk Çerçeveleri</button>
    <button class="nav-btn" onclick="switchView('roi', null, this)" id="navRoi">Lisans ROI &amp; Simülatör</button>
    <button class="nav-btn" onclick="switchView('copilot', null, this)" id="navCopilot">Copilot Hazırlık &amp; ROI</button>
    <button class="nav-btn" onclick="switchView('roadmap', null, this)" id="navRoadmap">30-60-90 Gün Planı</button>
  </aside>

  <main class="main">
    <div class="header">
      <div>
        <h1 id="pageTitle">ZeroTrustLens</h1>
        <div class="meta" id="tenantMeta"></div>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="btn" onclick="exportCsv()" id="btnCsv">CSV İndir</button>
        <button class="btn" onclick="window.print()" id="btnPrint">PDF / Yazdır</button>
      </div>
    </div>

    <section id="tab-overview" class="tab-panel active">
      <div class="cards" id="summaryCards"></div>
      <div class="cards" id="tenantInsightCards"></div>
      <div class="charts-row">
        <div class="card" style="display:flex;flex-direction:column;align-items:center;justify-content:center;">
          <div class="lbl" id="donutLbl">Kontrol Dağılımı</div>
          <svg id="donutChart" width="180" height="180" viewBox="0 0 42 42"></svg>
        </div>
        <div class="card">
          <div class="lbl" style="margin-bottom:12px;" id="fwChartLbl">Çerçeve Uyum Puanları</div>
          <div id="overviewFwBars"></div>
        </div>
      </div>
      <div class="card" id="mfaBanner" style="margin-bottom:20px;font-size:13.5px;color:var(--muted);"></div>
      <div class="card" id="pillarMatrixCard" style="margin-bottom:20px;"></div>
      <div class="card" id="execActionDigest" style="margin-bottom:20px;"></div>
    </section>

    <section id="tab-frameworks" class="tab-panel">
      <div class="card"><div id="fwDetailBars"></div></div>
    </section>

    <section id="tab-roi" class="tab-panel">
      <div class="card" id="roiBox" style="margin-bottom:16px;"></div>
      <div class="card" id="skuRoiBox" style="margin-bottom:16px;"></div>
      <div class="card" id="wasteRoiBox" style="margin-bottom:16px;"></div>
      <div class="card" id="minLicBox"></div>
    </section>

    <section id="tab-copilot" class="tab-panel">
      <div class="cards" id="copilotSummaryCards"></div>
      <div class="card" id="copilotWarningsBox" style="margin-bottom:16px;"></div>
      <div class="card" id="copilotChecksBox" style="margin-bottom:16px;"></div>
      <div class="card" id="copilotCalcBox"></div>
    </section>

    <section id="tab-roadmap" class="tab-panel">
      <div class="cards" id="roadmapCards"></div>
      <div class="card" id="roadmapDetail"></div>
    </section>

    <section id="tab-findings" class="tab-panel">
      <div class="filter-bar">
        <div class="filter-row">
          <input type="text" id="searchInput" placeholder="ID, başlık, kategori, SFI veya lisans ara..." oninput="renderFindings()" />
          <select id="sfiFilter" onchange="renderFindings()"><option value="ALL">Tüm SFI Sütunları</option></select>
          <select id="catFilter" onchange="renderFindings()"><option value="ALL">Tüm Kategoriler</option></select>
          <select id="costFilter" onchange="renderFindings()">
            <option value="ALL">Tüm Maliyetler</option>
            <option value="Low">Düşük Maliyet (Hızlı)</option>
            <option value="Medium">Orta Maliyet</option>
            <option value="High">Yüksek Maliyet</option>
          </select>
        </div>
        <div class="filter-row" id="statusChips"></div>
        <div class="filter-row" id="riskChips"></div>
        <div style="display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted);">
          <span id="showingCount"></span>
          <div style="display:flex;gap:8px;">
            <button class="chip" onclick="toggleAllDetails(true)" id="btnExpandAll">Tümünü Aç</button>
            <button class="chip" onclick="toggleAllDetails(false)" id="btnCollapseAll">Tümünü Kapat</button>
          </div>
        </div>
      </div>
      <div id="findingsList"></div>
    </section>
  </main>

  <script>
    const DATA = {{REPORT_JSON}};
    const isTr = DATA.Language === 'tr';
    let activePillarFilter = 'ALL';
    let activeStatusFilter = 'ALL';
    let activeRiskFilter = 'ALL';
    let currentFiltered = [];

    if (!isTr) {
      document.getElementById('navOverview').textContent = 'Overview';
      document.getElementById('grpPillars').textContent = 'Security Pillars';
      document.getElementById('navOrca').firstChild.textContent = 'Email / MDO (ORCA)';
      document.getElementById('navAllFindings').firstChild.textContent = 'All Findings';
      document.getElementById('grpExec').textContent = 'Executive & CISO';
      document.getElementById('navQuickWins').firstChild.textContent = 'Quick Wins';
      document.getElementById('navFrameworks').textContent = 'Frameworks';
      document.getElementById('navRoi').textContent = 'License ROI & Simulator';
      document.getElementById('navCopilot').textContent = 'Copilot Readiness & ROI';
      document.getElementById('navRoadmap').textContent = '30-60-90 Roadmap';
      document.getElementById('btnCsv').textContent = 'Export CSV';
      document.getElementById('btnPrint').textContent = 'Print / PDF';
      document.getElementById('donutLbl').textContent = 'Control Distribution';
      document.getElementById('fwChartLbl').textContent = 'Framework Compliance';
      document.getElementById('searchInput').placeholder = 'Search ID, title, category, SFI or license...';
      document.getElementById('btnExpandAll').textContent = 'Expand All';
      document.getElementById('btnCollapseAll').textContent = 'Collapse All';
    }

    document.getElementById('tenantMeta').textContent = `${DATA.Tenant} | ${isTr ? 'Salt Okunur Değerlendirme' : 'Read-Only Assessment'}`;

    function esc(s) {
      return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function renderMd(md) {
      if (!md) return '';
      const lines = esc(md).split(/\r?\n/);
      let out = '', inTable = false, inList = false;
      for (let i = 0; i < lines.length; i++) {
        let ln = lines[i].trim();
        if (ln.startsWith('|') && ln.endsWith('|')) {
          if (/^\|[\s\-:|]+\|$/.test(ln)) continue;
          if (inList) { out += '</ul>'; inList = false; }
          if (!inTable) { out += '<table class="md-table"><tbody>'; inTable = true; }
          const cells = ln.slice(1, -1).split('|').map(c => c.trim());
          const tag = (i + 1 < lines.length && /^\|[\s\-:|]+\|$/.test(lines[i+1].trim())) ? 'th' : 'td';
          out += '<tr>' + cells.map(c => `<${tag}>${inlineMd(c)}</${tag}>`).join('') + '</tr>';
          continue;
        }
        if (inTable) { out += '</tbody></table>'; inTable = false; }
        if (ln.startsWith('- ') || ln.startsWith('* ')) {
          if (!inList) { out += '<ul class="md-ul">'; inList = true; }
          out += `<li>${inlineMd(ln.slice(2))}</li>`;
          continue;
        }
        if (inList) { out += '</ul>'; inList = false; }
        if (ln) out += `<p style="margin-bottom:6px;">${inlineMd(ln)}</p>`;
      }
      if (inTable) out += '</tbody></table>';
      if (inList) out += '</ul>';
      return out;
    }

    function inlineMd(s) {
      return s
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1 ↗</a>');
    }

    function switchView(tabId, pillarMode, btn) {
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('tab-' + tabId).classList.add('active');
      if (btn) btn.classList.add('active');
      if (tabId === 'findings') {
        activePillarFilter = pillarMode || 'ALL';
        activeStatusFilter = 'ALL';
        activeRiskFilter = 'ALL';
        renderFilterChips();
        renderFindings();
      }
    }

    // Populate Pillar Counts
    const F = DATA.Findings || [];
    document.getElementById('cntAll').textContent = F.length;
    document.getElementById('cntIdentity').textContent = F.filter(x => (x.Pillar || '').includes('Identity')).length;
    document.getElementById('cntDevices').textContent = F.filter(x => (x.Pillar || '').includes('Devices')).length;
    document.getElementById('cntNetwork').textContent = F.filter(x => (x.Pillar || '').includes('Network') || (x.Pillar || '').includes('Infrastructure')).length;
    document.getElementById('cntDataAI').textContent = F.filter(x => (x.Pillar || '').includes('Data') || (x.Pillar || '').includes('AI')).length;
    document.getElementById('cntSecOps').textContent = F.filter(x => (x.Pillar || '').includes('SecOps')).length;
    document.getElementById('cntScuba').textContent = F.filter(x => (x.Pillar || '').includes('CISA SCuBA')).length;
    document.getElementById('cntOrca').textContent = F.filter(x => (x.Pillar || '').includes('ORCA')).length;
    document.getElementById('cntQuick').textContent = F.filter(x => x.Status === 'Failed' && x.ImplementationCost === 'Low').length;

    // Populate SFI & Category Dropdowns
    const sfiSet = [...new Set(F.map(x => x.SfiPillar).filter(Boolean))].sort();
    sfiSet.forEach(s => document.getElementById('sfiFilter').innerHTML += `<option value="${esc(s)}">${esc(s)}</option>`);
    const catSet = [...new Set(F.map(x => x.Category).filter(Boolean))].sort();
    catSet.forEach(c => document.getElementById('catFilter').innerHTML += `<option value="${esc(c)}">${esc(c)}</option>`);

    // Summary & Tenant Insights
    const s = DATA.Summary;
    document.getElementById('summaryCards').innerHTML = `
      <div class="card"><div class="lbl">${isTr ? 'Toplam Kontrol' : 'Total Checks'}</div><div class="val">${s.Total}</div></div>
      <div class="card"><div class="lbl">${isTr ? 'Başarılı' : 'Passed'}</div><div class="val" style="color:var(--ok)">${s.Passed}</div></div>
      <div class="card"><div class="lbl">${isTr ? 'Başarısız (Yüksek)' : 'Failed (High)'}</div><div class="val" style="color:var(--fail)">${s.Failed} (${s.HighRiskFailed})</div></div>
      <div class="card"><div class="lbl">${isTr ? 'İnceleme / Planlanan' : 'Investigate / Planned'}</div><div class="val" style="color:var(--warn)">${s.Investigate + s.Planned}</div></div>
      <div class="card"><div class="lbl">${isTr ? 'Atlanan (Lisans ROI)' : 'Skipped (License ROI)'}</div><div class="val" style="color:var(--skip)">${s.Skipped}</div></div>
    `;

    const ti = DATA.TenantInsights || {};
    const secureLabel = ti.SecureScoreCurrent !== null && ti.SecureScoreCurrent !== undefined
      ? `${ti.SecureScoreCurrent} / ${ti.SecureScoreMax}`
      : (isTr ? 'Canlı Oturumda Çekilir' : 'Live Run Only');
    document.getElementById('tenantInsightCards').innerHTML = `
      <div class="card"><div class="lbl">${isTr ? 'Kullanıcı / Misafir' : 'Users / Guests'}</div><div class="val">${ti.UserCount ?? '-'} / ${ti.GuestCount ?? '-'}</div></div>
      <div class="card"><div class="lbl">${isTr ? 'Grup / Uygulama' : 'Groups / Apps'}</div><div class="val">${ti.GroupCount ?? '-'} / ${ti.ApplicationCount ?? '-'}</div></div>
      <div class="card"><div class="lbl">${isTr ? 'Cihaz / Uyumlu' : 'Devices / Compliant'}</div><div class="val">${ti.DeviceCount ?? '-'} / ${ti.CompliantDevices ?? 0}</div></div>
      <div class="card"><div class="lbl">${isTr ? 'Ayrıcalıklı MFA (Phish-Res / Zayıf)' : 'Priv. MFA (Phish-Res / Phishable)'}</div><div class="val" style="font-size:20px;">${ti.PrivPhishResistant ?? 0} / ${(ti.PrivPhishable ?? 0) + (ti.PrivSingleFactor ?? 0)}</div></div>
      <div class="card"><div class="lbl">${isTr ? 'Microsoft Secure Score / AI Agent' : 'Secure Score / AI Agents'}</div><div class="val" style="font-size:18px;">${esc(secureLabel)} · ${ti.TotalAgents ?? 0}</div></div>
    `;
    document.getElementById('mfaBanner').innerHTML = `<strong>${isTr ? 'MFA & Koşullu Erişim Kapsamı:' : 'MFA & Conditional Access Coverage:'}</strong> ${esc(ti.MfaCoverageDesc || (isTr ? 'Veri yok' : 'No data'))}`;

    // CISO Risk Posture Matrix by Pillar
    const matrixPillars = [
      { key: 'Identity', label: isTr ? 'Identity (Kimlik)' : 'Identity', nav: 'navIdentity' },
      { key: 'Devices', label: isTr ? 'Devices (Cihazlar)' : 'Devices', nav: 'navDevices' },
      { key: 'Network', label: isTr ? 'Network (Ağ)' : 'Network', nav: 'navNetwork' },
      { key: 'DataAI', label: 'Data & AI', nav: 'navDataAI' },
      { key: 'SecOps', label: 'SecOps', nav: 'navSecOps' },
      { key: 'CISA SCuBA', label: 'CISA SCuBA Baseline', nav: 'navScuba' },
      { key: 'ORCA', label: isTr ? 'E-posta Güvenliği (ORCA)' : 'Email Security (ORCA)', nav: 'navOrca' }
    ];
    const matrixRows = matrixPillars.map(mp => {
      const items = F.filter(x => {
        const p = x.Pillar || '';
        if (mp.key === 'DataAI') return p.includes('Data') || p.includes('AI');
        if (mp.key === 'Network') return p.includes('Network') || p.includes('Infrastructure');
        return p.includes(mp.key);
      });
      const pass = items.filter(x => x.Status === 'Passed').length;
      const fail = items.filter(x => x.Status === 'Failed').length;
      const hi   = items.filter(x => x.Status === 'Failed' && x.Risk === 'High').length;
      const med  = items.filter(x => x.Status === 'Failed' && x.Risk === 'Medium').length;
      const evalC = pass + fail;
      const pct = evalC > 0 ? Math.round((pass / evalC) * 100) : 0;
      return `<tr style="cursor:pointer;" onclick="switchView('findings', '${mp.key}', document.getElementById('${mp.nav}'))">
        <td><strong>${mp.label}</strong></td>
        <td>${items.length}</td>
        <td style="color:var(--ok)">${pass}</td>
        <td style="color:var(--fail)"><strong>${hi}</strong></td>
        <td style="color:var(--warn)">${med}</td>
        <td><strong>${pct}%</strong></td>
      </tr>`;
    }).join('');
    document.getElementById('pillarMatrixCard').innerHTML = `

      document.getElementById('roadmapCards').innerHTML = phases.map((r, idx) => `
        <div class="card road-card ${idx === activePhaseIdx ? 'active' : ''}" onclick="selectPhase(${idx})">
          <div class="lbl">${esc(r.Phase)}</div>
          <div class="val" style="margin-bottom:8px;">${r.Count}</div>
          <div style="font-size:13px;color:var(--muted);">${esc(r.Focus)}</div>
        </div>
      `).join('');
      const items = activePhaseIdx === 0
        ? F.filter(x => x.Status === 'Failed' && x.Risk === 'High')
        : (activePhaseIdx === 1
          ? F.filter(x => x.Status === 'Failed' && x.Risk === 'Medium')
          : F.filter(x => (x.Status === 'Failed' && x.Risk === 'Low') || x.Status === 'Investigate'));
      const pRows = items.map(x => `
        <tr>
          <td><strong>${esc(x.Title)}</strong><div style="font-size:11.5px;color:var(--muted);">${esc(x.Pillar)} · ${esc(x.Category)}</div></td>
          <td><span class="pill ${esc(x.Status)}">${esc(x.Status)}</span></td>
          <td>${esc(x.Risk)}</td>
          <td style="font-size:12px;">${esc(isTr ? (x.RemediationTr || '') : (x.Description || '').slice(0, 140))}</td>
        </tr>
      `).join('');
      document.getElementById('roadmapDetail').innerHTML = `
        <h3 style="margin-bottom:10px;">${esc(phases[activePhaseIdx]?.Phase || '')} (${items.length})</h3>
        <table class="md-table">
          <thead><tr><th>${isTr ? 'Kontrol' : 'Control'}</th><th>${isTr ? 'Durum' : 'Status'}</th><th>Risk</th><th>${isTr ? 'İyileştirme Adımı' : 'Remediation'}</th></tr></thead>
          <tbody>${pRows}</tbody>
        </table>
      `;
    }
    function selectPhase(i) { activePhaseIdx = i; renderRoadmap(); }
    renderRoadmap();

    function renderFilterChips() {
      const statuses = ['ALL', 'Failed', 'Passed', 'Skipped', 'Investigate', 'Planned'];
      document.getElementById('statusChips').innerHTML = `<span style="font-size:12px;color:var(--muted);">${isTr ? 'Durum:' : 'Status:'}</span>` +
        statuses.map(st => `<button class="chip ${activeStatusFilter === st ? 'active' : ''}" onclick="setStatus('${st}')">${st === 'ALL' ? (isTr ? 'Tümü' : 'All') : st}</button>`).join('');

      const risks = ['ALL', 'High', 'Medium', 'Low'];
      document.getElementById('riskChips').innerHTML = `<span style="font-size:12px;color:var(--muted);">Risk:</span>` +
        risks.map(rk => `<button class="chip ${activeRiskFilter === rk ? 'active' : ''}" onclick="setRisk('${rk}')">${rk === 'ALL' ? (isTr ? 'Tümü' : 'All') : rk}</button>`).join('');
    }
    function setStatus(s) { activeStatusFilter = s; renderFilterChips(); renderFindings(); }
    function setRisk(r) { activeRiskFilter = r; renderFilterChips(); renderFindings(); }
    function toggleAllDetails(open) { document.querySelectorAll('#findingsList details').forEach(d => d.open = open); }

    function renderFindings() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const sfi = document.getElementById('sfiFilter').value;
      const cat = document.getElementById('catFilter').value;
      const cst = document.getElementById('costFilter').value;

      currentFiltered = F.filter(f => {
        const pStr = f.Pillar || '';
        if (activePillarFilter === 'DataAI' && !pStr.includes('Data') && !pStr.includes('AI')) return false;
        else if (activePillarFilter === 'Network' && !pStr.includes('Network') && !pStr.includes('Infrastructure')) return false;
        else if (activePillarFilter === 'QUICKWINS' && !(f.Status === 'Failed' && f.ImplementationCost === 'Low')) return false;
        else if (!['ALL', 'DataAI', 'Network', 'QUICKWINS'].includes(activePillarFilter) && !pStr.includes(activePillarFilter)) return false;

        if (activeStatusFilter !== 'ALL' && f.Status !== activeStatusFilter) return false;
        if (activeRiskFilter !== 'ALL' && f.Risk !== activeRiskFilter) return false;
        if (sfi !== 'ALL' && f.SfiPillar !== sfi) return false;
        if (cat !== 'ALL' && f.Category !== cat) return false;
        if (cst !== 'ALL' && f.ImplementationCost !== cst) return false;

        if (q) {
          const hay = `${f.Id} ${f.Title} ${f.Category} ${f.SfiPillar} ${f.MinimumLicense} ${f.Pillar}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });

      document.getElementById('showingCount').textContent = isTr
        ? `Gösterilen: ${currentFiltered.length} / ${F.length} kontrol`
        : `Showing ${currentFiltered.length} of ${F.length} checks`;

      document.getElementById('findingsList').innerHTML = currentFiltered.map(f => {
        const trBox = isTr
          ? `<div style="margin-bottom:10px;padding:8px 10px;background:rgba(56,189,248,.08);border-left:3px solid var(--accent);border-radius:4px;"><strong>Türkçe İyileştirme Adımları:</strong><div style="margin-top:4px;">${esc(f.RemediationTr)}</div></div>`
          : '';
        const impBlock = f.Impact ? `<div style="margin-bottom:8px;"><strong>${isTr ? 'Etki:' : 'Impact:'}</strong> <span style="color:#fcd34d;">${esc(f.Impact)}</span></div>` : '';
        const resBlock = f.Result ? `<div style="margin-bottom:10px;"><strong>${isTr ? 'Tespit & Etkilenen Kaynaklar:' : 'Finding & Affected Resources:'}</strong>${renderMd(f.Result)}</div>` : '';
        const skipBlock = f.SkippedReason ? `<div style="margin-bottom:10px;color:#d8b4fe;"><strong>${isTr ? 'Atlanma Nedeni:' : 'Skipped Reason:'}</strong> ${renderMd(f.SkippedReason)}</div>` : '';
        const descBlock = f.Description ? `<div><strong>${isTr ? 'Açıklama ve Microsoft Önerisi:' : 'Description & Recommendation:'}</strong>${renderMd(f.Description)}</div>` : '';

        return `
          <div class="finding">
            <div class="finding-top">
              <div>
                <strong>${esc(f.Title)}</strong>
                <div class="f-meta">
                  <span class="tag">${esc(f.Pillar)}</span>
                  <span class="tag">${esc(f.Category)}</span>
                  ${f.SfiPillar ? `<span class="tag">SFI: ${esc(f.SfiPillar)}</span>` : ''}
                  ${f.MinimumLicense ? `<span class="tag">${isTr ? 'Lisans:' : 'License:'} ${esc(f.MinimumLicense)}</span>` : ''}
                  <span class="tag">${isTr ? 'Maliyet:' : 'Cost:'} ${esc(f.ImplementationCost)}</span>
                </div>
              </div>
              <div style="white-space:nowrap;">
                <span class="pill ${esc(f.Status)}">${esc(f.Status)}</span>
                <span class="pill">${esc(f.Risk)}</span>
              </div>
            </div>
            <details>
              <summary>${isTr ? 'Detaylar, Etkilenen Kaynaklar ve İyileştirme Adımları' : 'Details, Affected Resources & Remediation'}</summary>
              <div class="rem-box">${trBox}${impBlock}${resBlock}${skipBlock}${descBlock}</div>
            </details>
          </div>
        `;
      }).join('');
    }

    function exportCsv() {
      const rows = [['Id','Pillar','Category','SfiPillar','Status','Risk','Cost','License','Title']];
      (currentFiltered.length ? currentFiltered : F).forEach(f => {
        rows.push([f.Id, f.Pillar, f.Category, f.SfiPillar, f.Status, f.Risk, f.ImplementationCost, f.MinimumLicense, f.Title].map(v => '"' + String(v || '').replace(/"/g,'""') + '"'));
      });
      const blob = new Blob([rows.map(r => r.join(',')).join('\n')], { type: 'text/csv;charset=utf-8;' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `ZeroTrustLens-${DATA.Language}.csv`;
      a.click();
    }

    renderFilterChips();
  </script>
</body>
</html>

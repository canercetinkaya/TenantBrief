<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZeroTrustLens — {{TITLE}}</title>
  <style>
    :root {
      --bg:#0b0f19; --card:#131a2a; --card2:#0f1624; --border:#1f2a44;
      --text:#e2e8f0; --muted:#94a3b8; --accent:#38bdf8;
      --ok:#22c55e; --fail:#ef4444; --warn:#f59e0b; --skip:#a855f7;
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); display:flex; min-height:100vh; }
    .sidebar { width:250px; background:var(--card2); border-right:1px solid var(--border); padding:22px 14px; display:flex; flex-direction:column; gap:6px; position:sticky; top:0; height:100vh; }
    .brand { display:flex; align-items:center; gap:10px; font-size:18px; font-weight:700; padding:0 10px 16px; border-bottom:1px solid var(--border); margin-bottom:10px; }
    .logo { width:32px; height:32px; border-radius:8px; background:linear-gradient(135deg,#0ea5e9,#6366f1); display:flex; align-items:center; justify-content:center; font-weight:800; color:#fff; font-size:14px; }
    .nav-btn { background:transparent; border:none; color:var(--muted); text-align:left; padding:10px 12px; border-radius:8px; cursor:pointer; font-size:14px; font-weight:500; transition:.15s; }
    .nav-btn:hover { background:rgba(56,189,248,.08); color:var(--text); }
    .nav-btn.active { background:rgba(56,189,248,.16); color:var(--accent); font-weight:600; }
    .main { flex:1; padding:28px; max-width:1280px; margin:0 auto; width:100%; }
    .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; flex-wrap:wrap; gap:12px; }
    .meta { font-size:13px; color:var(--muted); }
    .tab-panel { display:none; }
    .tab-panel.active { display:block; }
    .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px; margin-bottom:22px; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; }
    .card .lbl { font-size:12px; color:var(--muted); margin-bottom:6px; }
    .card .val { font-size:28px; font-weight:700; }
    .charts-row { display:grid; grid-template-columns:300px 1fr; gap:18px; margin-bottom:22px; }
    @media (max-width:900px) { body { flex-direction:column; } .sidebar { width:100%; height:auto; position:static; flex-direction:row; overflow-x:auto; } .charts-row { grid-template-columns:1fr; } }
    .bar-row { margin-bottom:12px; }
    .bar-head { display:flex; justify-content:space-between; font-size:13px; margin-bottom:5px; }
    .bar-track { height:10px; background:#1e293b; border-radius:999px; overflow:hidden; }
    .bar-fill { height:100%; background:linear-gradient(90deg,#0ea5e9,#22c55e); border-radius:999px; }
    .filters { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
    input, select { background:var(--card); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:8px 12px; font-size:13px; }
    .finding { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px 16px; margin-bottom:10px; }
    .finding-top { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
    .pill { font-size:11px; padding:3px 9px; border-radius:999px; font-weight:600; }
    .pill.Passed { background:rgba(34,197,94,.15); color:var(--ok); }
    .pill.Failed { background:rgba(239,68,68,.15); color:var(--fail); }
    .pill.Skipped { background:rgba(168,85,247,.15); color:var(--skip); }
    .pill.Investigate, .pill.Planned { background:rgba(245,158,11,.15); color:var(--warn); }
    details { margin-top:10px; border-top:1px solid var(--border); padding-top:10px; }
    summary { cursor:pointer; color:var(--accent); font-size:13px; font-weight:600; }
    .rem-box { margin-top:8px; background:#090d16; border:1px solid var(--border); border-radius:8px; padding:12px; font-size:12.5px; line-height:1.55; }
    pre { background:#05080f; padding:10px; border-radius:6px; overflow-x:auto; margin-top:6px; color:#7dd3fc; font-size:12px; }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><div class="logo">ZL</div><span>ZeroTrustLens</span></div>
    <button class="nav-btn active" onclick="showTab('overview', this)" id="navOverview">Overview</button>
    <button class="nav-btn" onclick="showTab('frameworks', this)" id="navFrameworks">Frameworks</button>
    <button class="nav-btn" onclick="showTab('roi', this)" id="navRoi">License ROI</button>
    <button class="nav-btn" onclick="showTab('roadmap', this)" id="navRoadmap">30-60-90 Roadmap</button>
    <button class="nav-btn" onclick="showTab('findings', this)" id="navFindings">All Findings</button>
  </aside>

  <main class="main">
    <div class="header">
      <div>
        <h1 id="pageTitle">ZeroTrustLens</h1>
        <div class="meta" id="tenantMeta"></div>
      </div>
    </div>

    <section id="tab-overview" class="tab-panel active">
      <div class="cards" id="summaryCards"></div>
      <div class="charts-row">
        <div class="card" style="display:flex;flex-direction:column;align-items:center;justify-content:center;">
          <div class="lbl" id="donutLbl">Posture Distribution</div>
          <svg id="donutChart" width="180" height="180" viewBox="0 0 42 42"></svg>
        </div>
        <div class="card">
          <div class="lbl" style="margin-bottom:12px;" id="fwChartLbl">Compliance Frameworks</div>
          <div id="overviewFwBars"></div>
        </div>
      </div>
    </section>

    <section id="tab-frameworks" class="tab-panel">
      <div class="card"><div id="fwDetailBars"></div></div>
    </section>

    <section id="tab-roi" class="tab-panel">
      <div class="card" id="roiBox"></div>
    </section>

    <section id="tab-roadmap" class="tab-panel">
      <div class="cards" id="roadmapCards"></div>
    </section>

    <section id="tab-findings" class="tab-panel">
      <div class="filters">
        <input type="text" id="searchInput" placeholder="Search..." oninput="renderFindings()" />
        <select id="statusFilter" onchange="renderFindings()">
          <option value="ALL">All Statuses</option>
          <option value="Failed">Failed</option>
          <option value="Passed">Passed</option>
          <option value="Skipped">Skipped</option>
          <option value="Investigate">Investigate</option>
          <option value="Planned">Planned</option>
        </select>
        <select id="riskFilter" onchange="renderFindings()">
          <option value="ALL">All Risks</option>
          <option value="High">High</option>
          <option value="Medium">Medium</option>
          <option value="Low">Low</option>
        </select>
      </div>
      <div id="findingsList"></div>
    </section>
  </main>

  <script>
    const DATA = {{REPORT_JSON}};
    const isTr = DATA.Language === 'tr';

    if (isTr) {
      document.getElementById('navOverview').textContent = 'Genel Bakış';
      document.getElementById('navFrameworks').textContent = 'Uyumluluk Çerçeveleri';
      document.getElementById('navRoi').textContent = 'Lisans ROI & Kör Nokta';
      document.getElementById('navRoadmap').textContent = '30-60-90 Gün Yol Haritası';
      document.getElementById('navFindings').textContent = 'Tüm Bulgular';
      document.getElementById('donutLbl').textContent = 'Kontrol Dağılımı';
      document.getElementById('fwChartLbl').textContent = 'Çerçeve Uyum Puanları';
      document.getElementById('searchInput').placeholder = 'Bulgu veya kategori ara...';
    }

    document.getElementById('tenantMeta').textContent = `${DATA.Tenant} | ${isTr ? 'Salt Okunur Değerlendirme' : 'Read-Only Assessment'}`;

    function showTab(id, btn) {
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('tab-' + id).classList.add('active');
      btn.classList.add('active');
    }

    const s = DATA.Summary;
    document.getElementById('summaryCards').innerHTML = `
      <div class="card"><div class="lbl">${isTr ? 'Toplam Kontrol' : 'Total Checks'}</div><div class="val">${s.Total}</div></div>
      <div class="card"><div class="lbl">${isTr ? 'Başarılı' : 'Passed'}</div><div class="val" style="color:var(--ok)">${s.Passed}</div></div>
      <div class="card"><div class="lbl">${isTr ? 'Başarısız (Yüksek)' : 'Failed (High)'}</div><div class="val" style="color:var(--fail)">${s.Failed} (${s.HighRiskFailed})</div></div>
      <div class="card"><div class="lbl">${isTr ? 'Atlanan (Lisans ROI)' : 'Skipped (License ROI)'}</div><div class="val" style="color:var(--skip)">${s.Skipped}</div></div>
    `;

    // SVG Donut Chart
    const total = Math.max(1, s.Total);
    const pPct = (s.Passed / total) * 100;
    const fPct = (s.Failed / total) * 100;
    const skPct = (s.Skipped / total) * 100;
    document.getElementById('donutChart').innerHTML = `
      <circle cx="21" cy="21" r="15.915" fill="transparent" stroke="#1e293b" stroke-width="5"></circle>
      <circle cx="21" cy="21" r="15.915" fill="transparent" stroke="#22c55e" stroke-width="5" stroke-dasharray="${pPct} ${100 - pPct}" stroke-dashoffset="25"></circle>
      <circle cx="21" cy="21" r="15.915" fill="transparent" stroke="#ef4444" stroke-width="5" stroke-dasharray="${fPct} ${100 - fPct}" stroke-dashoffset="${25 - pPct}"></circle>
      <circle cx="21" cy="21" r="15.915" fill="transparent" stroke="#a855f7" stroke-width="5" stroke-dasharray="${skPct} ${100 - skPct}" stroke-dashoffset="${25 - pPct - fPct}"></circle>
      <text x="21" y="22.5" text-anchor="middle" fill="#e2e8f0" font-size="6" font-weight="700">${Math.round(pPct)}%</text>
    `;

    const fwHtml = DATA.Frameworks.map(f => `
      <div class="bar-row">
        <div class="bar-head"><span>${f.Name}</span><span>${f.Passed} / ${f.Evaluated} (<strong>${f.Score}%</strong>)</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${f.Score}%"></div></div>
      </div>
    `).join('');
    document.getElementById('overviewFwBars').innerHTML = fwHtml;
    document.getElementById('fwDetailBars').innerHTML = fwHtml;

    document.getElementById('roiBox').innerHTML = `
      <h3 style="margin-bottom:10px;">${isTr ? 'Lisans ROI & Çerçeve Etki Simülasyonu' : 'License ROI & Framework Impact Simulator'}</h3>
      <p style="color:var(--muted);font-size:14px;line-height:1.6;margin-bottom:16px;">
        ${isTr
          ? `Toplam <strong>${s.Skipped}</strong> kontrol atlandı (Skipped) ve <strong>${s.Planned}</strong> kontrol planlandı (Planned). Aşağıdaki simülasyon ile bu lisans kör noktalarını veya yüksek riskli bulguları kapattığınızda uyumluluk skorlarınızın nasıl değişeceğini görebilirsiniz.`
          : `A total of <strong>${s.Skipped}</strong> checks were Skipped and <strong>${s.Planned}</strong> are Planned. Use the simulator below to preview how closing license blind spots or high-risk findings improves your compliance scores.`}
      </p>
      <div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px;">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13.5px;">
          <input type="checkbox" id="simHigh" onchange="runSim()" /> ${isTr ? `Yüksek riskli ${s.HighRiskFailed} bulguyu çöz` : `Fix ${s.HighRiskFailed} High-risk findings`}
        </label>
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13.5px;">
          <input type="checkbox" id="simSkipped" onchange="runSim()" /> ${isTr ? `Atlanan ${s.Skipped} lisans özelliğini devreye al` : `Activate ${s.Skipped} Skipped license features`}
        </label>
      </div>
      <div id="simResults"></div>
    `;

    function runSim() {
      const fixHigh = document.getElementById('simHigh').checked;
      const fixSkip = document.getElementById('simSkipped').checked;
      const baseEval = Math.max(1, DATA.Frameworks[0]?.Evaluated || (s.Passed + s.Failed));
      const addedPass = (fixHigh ? s.HighRiskFailed : 0) + (fixSkip ? s.Skipped : 0);
      const newEval = baseEval + (fixSkip ? s.Skipped : 0);
      document.getElementById('simResults').innerHTML = DATA.Frameworks.map(f => {
        const simScore = Math.min(100, Math.round(((f.Passed + addedPass) / newEval) * 1000) / 10);
        const delta = Math.round((simScore - f.Score) * 10) / 10;
        return `<div class="bar-row"><div class="bar-head"><span>${f.Name}</span><span>${f.Score}% → <strong style="color:var(--ok)">${simScore}%</strong> (+${delta}%)</span></div><div class="bar-track"><div class="bar-fill" style="width:${simScore}%"></div></div></div>`;
      }).join('');
    }
    runSim();

    const high = DATA.Findings.filter(x => x.Status === 'Failed' && x.Risk === 'High').length;
    const med = DATA.Findings.filter(x => x.Status === 'Failed' && x.Risk === 'Medium').length;
    const low = DATA.Findings.filter(x => x.Status === 'Failed' && x.Risk === 'Low').length;
    document.getElementById('roadmapCards').innerHTML = `
      <div class="card"><div class="lbl">${isTr ? '0-30 Gün (Yüksek Risk)' : '0-30 Days (High Risk)'}</div><div class="val" style="color:var(--fail)">${high}</div></div>
      <div class="card"><div class="lbl">${isTr ? '31-60 Gün (Orta Risk)' : '31-60 Days (Medium Risk)'}</div><div class="val" style="color:var(--warn)">${med}</div></div>
      <div class="card"><div class="lbl">${isTr ? '61-90 Gün (Düşük Risk)' : '61-90 Days (Low Risk)'}</div><div class="val" style="color:var(--accent)">${low}</div></div>
    `;

    function getRemediation(f) {
      const trSummary = f.Status === 'Skipped'
        ? `Bu kontrol mevcut kiracı ortamında uygulanabilir olmadığı veya ilgili lisans/modül etkinleştirilmediği için atlandı (Lisans ROI kör noktası).`
        : (f.Status === 'Failed'
          ? `Bu kontrol başarısız oldu. "${f.Pillar}" kategorisi altındaki ilgili ilkeyi Microsoft yönetim portalında önce Report-only (Denetim) kipinde yapılandırıp doğrulayın.`
          : `Bu kontrol mevcut yapılandırmada başarılı veya inceleme aşamasındadır.`);
      const summaryBlock = isTr
        ? `<div style="margin-bottom:10px;padding:8px 10px;background:rgba(56,189,248,.08);border-left:3px solid var(--accent);border-radius:4px;"><strong>Türkçe İyileştirme Adımları:</strong><div style="margin-top:4px;">${f.RemediationTr || trSummary}</div></div>`
        : '';
      const impBlock = f.Impact ? `<div style="margin-bottom:8px;"><strong>${isTr ? 'Etki:' : 'Impact:'}</strong> <span style="color:#fcd34d;">${f.Impact}</span></div>` : '';
      const detailBlock = f.Result
        ? `<div style="margin-bottom:10px;"><strong>${isTr ? 'Tespit & Etkilenen Kaynaklar:' : 'Finding & Affected Resources:'}</strong><div style="margin-top:4px;color:#cbd5e1;white-space:pre-wrap;">${f.Result}</div></div>`
        : '';
      const descBlock = f.Description
        ? `<div><strong>${isTr ? 'Açıklama ve Microsoft Önerisi:' : 'Technical Reference:'}</strong><div style="color:#94a3b8;white-space:pre-wrap;margin-top:4px;">${f.Description}</div></div>`
        : '';
      return `<div class="rem-box">${summaryBlock}${impBlock}${detailBlock}${descBlock}</div>`;
    }

    function renderFindings() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const st = document.getElementById('statusFilter').value;
      const rk = document.getElementById('riskFilter').value;
      const list = DATA.Findings.filter(f =>
        (st === 'ALL' || f.Status === st) &&
        (rk === 'ALL' || f.Risk === rk) &&
        ((f.Title || '').toLowerCase().includes(q) || (f.Pillar || '').toLowerCase().includes(q) || (f.Id || '').toLowerCase().includes(q))
      ).slice(0, 150);

      document.getElementById('findingsList').innerHTML = list.map(f => `
        <div class="finding">
          <div class="finding-top">
            <div><strong>${f.Id}</strong> — ${f.Title} <span style="color:var(--muted);font-size:12px;">(${f.Pillar})</span></div>
            <div><span class="pill ${f.Status}">${f.Status}</span> <span class="pill">${f.Risk}</span></div>
          </div>
          <details>
            <summary>${isTr ? 'PowerShell ve Portal Düzeltme Adımları' : 'PowerShell & Portal Remediation Steps'}</summary>
            ${getRemediation(f)}
          </details>
        </div>
      `).join('');
    }
    renderFindings();
  </script>
</body>
</html>

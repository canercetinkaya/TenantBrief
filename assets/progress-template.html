<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TenantBrief — {{TITLE}}</title>
  <style>
    :root {
      --bg:#0b0d14; --surface:#07080d; --card:#11141c; --raised:#1a1e28;
      --border:rgba(238,240,245,.09); --border-strong:rgba(238,240,245,.16);
      --text:#eef0f5; --text2:#a3a9b8; --muted:#8891a6; --accent:#38bdf8;
      --ok:#4cc38a; --warn:#e5a93b; --fail:#e5484d;
      --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
      --ease:cubic-bezier(0.22,1,0.36,1);
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; font-size:14px; line-height:1.5; background:var(--bg); color:var(--text); min-height:100vh; padding:24px 16px; display:flex; justify-content:center; -webkit-font-smoothing:antialiased; }
    .box { width:100%; max-width:920px; background:var(--card); border:1px solid var(--border); border-radius:16px; padding:24px; height:fit-content; }
    .top { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; border-bottom:1px solid var(--border); padding-bottom:16px; }
    .brand { display:flex; align-items:center; gap:12px; font-size:18px; font-weight:600; letter-spacing:-0.01em; }
    .logo { width:32px; height:32px; border-radius:8px; background:var(--raised); border:1px solid var(--border-strong); display:flex; align-items:center; justify-content:center; font-weight:600; font-size:13px; font-family:var(--mono); color:var(--text); }
    .badge { font-size:12px; font-weight:500; padding:4px 10px; border-radius:6px; background:rgba(56,189,248,.12); color:var(--accent); border:1px solid rgba(56,189,248,.32); }
    .badge.err { background:rgba(229,72,77,.14); color:var(--fail); border-color:rgba(229,72,77,.36); }
    .notice { background:var(--raised); border:1px solid var(--border-strong); color:var(--text2); border-radius:8px; padding:12px 16px; font-size:13px; margin-bottom:16px; }
    .notice.err { background:rgba(229,72,77,.10); border-color:rgba(229,72,77,.38); color:#fca5a5; }
    .pbar-wrap { height:8px; background:var(--raised); border-radius:4px; overflow:hidden; margin-bottom:16px; }
    .pbar { height:100%; background:var(--accent); border-radius:4px; width:5%; transition:width 300ms var(--ease); }
    .stages { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:8px; margin-bottom:16px; }
    .stage { padding:8px 12px; border-radius:8px; background:var(--surface); border:1px solid var(--border); font-size:12.5px; color:var(--text2); display:flex; align-items:center; gap:8px; }
    .stage.active { border-color:rgba(56,189,248,.45); background:var(--raised); color:var(--text); font-weight:500; }
    .stage.done { border-color:rgba(76,195,138,.36); background:rgba(76,195,138,.08); color:var(--ok); }
    .stats { display:flex; gap:20px; flex-wrap:wrap; font-size:13px; color:var(--muted); margin-bottom:12px; padding-bottom:12px; border-bottom:1px solid var(--border); font-variant-numeric:tabular-nums; }
    .stats strong { color:var(--text); font-weight:500; font-family:var(--mono); }
    .task { display:flex; justify-content:space-between; align-items:flex-start; padding:10px 12px; border-radius:8px; background:var(--surface); border:1px solid var(--border); margin-bottom:8px; font-size:13px; }
    .task.running { border-color:rgba(56,189,248,.4); }
    .task-det { font-size:12px; color:var(--muted); margin-top:4px; font-family:var(--mono); font-variant-numeric:tabular-nums; }
    .st-run { color:var(--accent); font-weight:500; font-size:12px; }
    .st-done { color:var(--ok); font-weight:500; font-size:12px; }
    .st-fail { color:var(--fail); font-weight:500; font-size:12px; }
    .tasks-wrap { max-height:384px; overflow-y:auto; }
    @media (prefers-reduced-motion: reduce) { .pbar { transition:none; } }
  </style>
</head>
<body>
  <div class="box">
    <div class="top">
      <div class="brand"><div class="logo">TB</div><span>TenantBrief</span></div>
      <span class="badge" id="statusBadge">{{RUNNING}}</span>
    </div>
    <div class="notice" id="noticeBox">{{NOTICE}}</div>
    <div class="pbar-wrap"><div class="pbar" id="pbar"></div></div>
    <div class="stages" id="stages"></div>
    <div class="stats">
      <span><strong id="ztPhase">-</strong></span>
      <span>{{LBL_COMPLETED}}: <strong id="doneCnt">0 / 0</strong></span>
      <span>{{LBL_FAILED}}: <strong id="failCnt" style="color:var(--fail)">0</strong></span>
      <span>{{LBL_ELAPSED}}: <strong id="elapsed">00:00</strong></span>
    </div>
    <div class="tasks-wrap" id="tasksList"></div>
  </div>
  <script>
    const start = Date.now();
    const isTr = (document.documentElement.lang || '').toLowerCase() === 'tr';
    const labels = {{LABELS_JSON}};
    let pollTimer = null;
    let missCount = 0;
    function fmt(ms) {
      const s = Math.max(0, Math.floor(ms / 1000));
      return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
    }
    function esc(s) {
      return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
    function stopWithError(badgeTxt, msg) {
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
      const b = document.getElementById('statusBadge');
      b.textContent = badgeTxt;
      b.classList.add('err');
      const nb = document.getElementById('noticeBox');
      nb.classList.add('err');
      nb.textContent = msg;
      document.getElementById('pbar').style.background = 'var(--fail)';
    }
    async function poll() {
      document.getElementById('elapsed').textContent = fmt(Date.now() - start);
      try {
        const res = await fetch('/status.json?t=' + Date.now());
        if (!res.ok) throw new Error('HTTP ' + res.status);
        missCount = 0;
        const d = await res.json();
        document.getElementById('stages').innerHTML = labels.map((lbl, idx) => {
          const step = idx + 1;
          const cls = step < d.stage ? 'done' : (step === d.stage ? 'active' : '');
          const icon = step < d.stage ? '✓' : (step === d.stage ? '●' : '○');
          return `<div class="stage ${cls}"><span>${icon}</span><span>${esc(lbl)}</span></div>`;
        }).join('');

        let pct = Math.round(((d.stage - 1) / labels.length) * 100);
        if (d.stage === 1 && d.ztTotal > 0) {
          const inner = Math.min(1, d.ztCompleted / d.ztTotal);
          pct = Math.max(4, Math.round(inner * 60));
        } else if (d.done) { pct = 100; }
        document.getElementById('pbar').style.width = Math.max(4, pct) + '%';

        document.getElementById('ztPhase').textContent = d.ztStageName || labels[d.stage - 1] || '';
        document.getElementById('doneCnt').textContent = `${d.ztCompleted || 0} / ${d.ztTotal || 0}`;
        document.getElementById('failCnt').textContent = d.ztFailed || 0;

        const workers = Array.isArray(d.workers) ? d.workers : [];
        document.getElementById('tasksList').innerHTML = workers.map(w => {
          const isRun = w.status === 'Running';
          const isFail = w.status === 'Failed';
          const cls = isRun ? 'running' : '';
          const stCls = isRun ? 'st-run' : (isFail ? 'st-fail' : 'st-done');
          const dur = w.startedAt ? fmt(Date.now() - new Date(w.startedAt).getTime()) : '';
          return `<div class="task ${cls}">
            <div><div><strong>${esc(w.name)}</strong></div>${w.detail ? `<div class="task-det">↳ ${esc(w.detail)}</div>` : ''}</div>
            <div style="text-align:right;white-space:nowrap;"><div class="${stCls}">${esc(w.status)}</div><div class="task-det">${dur}</div></div>
          </div>`;
        }).join('');

        if (d.error) {
          stopWithError(isTr ? 'Hata / Durdu' : 'Error / Stopped', (isTr ? 'Değerlendirme hata nedeniyle durduruldu: ' : 'Assessment stopped due to error: ') + d.error);
          return;
        }
        if (d.done) {
          if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
          document.getElementById('statusBadge').textContent = d.doneLabel;
        }
      } catch {
        missCount++;
        if (missCount >= 3) {
          stopWithError(
            isTr ? 'Oturum Sonlandı' : 'Disconnected',
            isTr ? 'PowerShell değerlendirme oturumu kapandı veya hata ile sonlandı. Lütfen PowerShell penceresindeki hata mesajını kontrol edin.' : 'PowerShell assessment session ended or stopped with an error. Please check the PowerShell console.'
          );
        }
      }
    }
    poll();
    pollTimer = setInterval(poll, 1000);
  </script>
</body>
</html>
